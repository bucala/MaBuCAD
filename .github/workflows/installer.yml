name: Installer

# Builds the Windows installers (MSI + NSIS — tauri.conf.json's own bundle.targets)
# for whatever version the repo currently carries.
#
# - Manual run (Actions ▸ Installer ▸ Run workflow): builds both installers and
#   uploads them as workflow artifacts named after the version. Nothing is published.
# - Pushing a v* tag (e.g. v0.19.0): the same build, plus the installers are attached
#   to a GitHub Release for that tag with generated notes. Tag pushes do NOT run the
#   CI workflow (`.github/workflows/ci.yml` filters on branches), so this is the
#   publishing path.
#
# Deliberately lean: `tauri build`'s own beforeBuildCommand (`npm run build` =
# `tsc && vite build`) already typechecks the frontend, and a tag is expected to be
# cut from main, which CI gates on every push — the same choice `scripts\build-msi.ps1`
# makes locally (typecheck, then build, no full test battery).

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

# Attaching files to a release needs write access to the repo's contents.
permissions:
  contents: write

# Two installer builds for the same ref never need to run concurrently; a queued tag
# build is never cancelled by a newer one.
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installers (MSI + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The version the installers are built for comes straight from tauri.conf.json,
      # so the workflow never needs a manual version bump — it builds whatever the
      # repo carries (package.json and Cargo.toml are kept in step with it).
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          "version=$($config.version)" >> $env:GITHUB_OUTPUT

      # No --bundles flag: tauri.conf.json's bundle.targets decides (both installers).
      - name: Build installers
        run: npm run tauri build

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaBuCAD_${{ steps.version.outputs.version }}_installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installers to the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
