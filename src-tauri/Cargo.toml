[package]
name = "mabucad"
# Kept in step with `package.json` and `tauri.conf.json` — three version sources, one
# number, so the status bar's readout and the installers never disagree with the frontend.
version = "0.28.0"
description = "Parametric 3D/2D CAD system for Windows 11 x64"
authors = ["Bucala"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mabucad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Rust-side dialogs for the file commands (`fileio.rs`'s pick_open_path/pick_save_path):
# the frontend never calls the plugin directly, so the webview holds no dialog permission.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
